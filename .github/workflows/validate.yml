name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace and plugin manifests
        run: |
          claude plugin validate .
          claude plugin validate .claude-plugin/plugin.json
      - name: Check that both plugin manifests have the same version
        run: |
          claude=$(jq -r .version .claude-plugin/plugin.json)
          cursor=$(jq -r .version .cursor-plugin/plugin.json)
          if [ "$claude" != "$cursor" ]; then
            echo "version mismatch: .claude-plugin=$claude .cursor-plugin=$cursor"
            exit 1
          fi
      - name: Check that every skill folder has a SKILL.md with name and description
        run: |
          for dir in skills/*/; do
            file="$dir/SKILL.md"
            test -f "$file" || { echo "missing $file"; exit 1; }
            grep -q '^name: ' "$file" || { echo "$file has no name"; exit 1; }
            grep -q '^description: ' "$file" || { echo "$file has no description"; exit 1; }
            name=$(sed -n 's/^name: *//p' "$file" | head -1)
            test "$name" = "$(basename "$dir")" || { echo "$file name '$name' differs from folder"; exit 1; }
          done
